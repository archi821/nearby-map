<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>附近站牌</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
    #back-home {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
    #back-home:hover {
      background: #eee;
    }
  </style>
</head>
<body>
  <a href="#" id="back-home">← 返回</a>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 讀取座標參數
    const params = new URLSearchParams(location.search);
    const lat = parseFloat(params.get("lat")) || 49.225;
    const lng = parseFloat(params.get("lng")) || -122.999;

    // 建立地圖
    const map = L.map("map").setView([lat, lng], 17);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
    }).addTo(map);
    L.circle([lat, lng], {
      radius: 20,
      color: "red",
      fillColor: "red",
      fillOpacity: 0.8,
    }).addTo(map);

    // 返回邏輯：iframe → 回上一頁；獨立頁 → 回 main_ui.html
    const isEmbedded = window.self !== window.top;
    const backLink = isEmbedded ? "javascript:history.back()" : "main_ui.html";
    document.getElementById("back-home").setAttribute("href", backLink);
  </script>
</body>
</html>
